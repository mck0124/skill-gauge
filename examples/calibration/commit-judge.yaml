# Real calibration set: 16 outputs collected with gen-rules.yaml / gen-naive.yaml,
# shuffled, then scored by a human (the repo author) without seeing their source.
# Labels were scored from a raw text file: an earlier pass in the terminal
# rendered some outputs truncated, which produced wrong labels.
# Run: skill-gauge calibrate examples/calibration/commit-judge.yaml
name: commit-judge
judge:
  command: claude -p --model haiku --tools "" --no-session-persistence --system-prompt "You are a strict evaluator. Follow the user's grading instructions exactly."
  isolate: true
  timeoutMs: 90000
repeat: 3
concurrency: 4
threshold: 0.7
tolerance: 0.2
rubric_text: &rubric "Score how usable the response is as a git commit message. Check all three: (1) the response contains ONLY the commit message - no code fences, no explanations, no alternatives or notes; (2) the subject line is imperative mood and at most 72 characters; (3) it accurately describes the change. 1.0 = commit as-is, 0.7 = minor issue, 0.4 = needs rewriting, 0 = unusable."
samples:
  - id: s01-docs-typo-naive
    input: "Fixed two typos in the README installation section."
    output: "```\nFix typos in README installation section\n```\n\nIf you want a body under it:\n\n```\nFix typos in README installation section\n\nCorrect two typos in the installation instructions.\n```\n\nThere's no git repository in the working directory, so I couldn't see the diff. If you tell me which words were fixed, I can name them in the message."
    rubric: *rubric
    human: 0.4
  - id: s02-perf-rules
    input: "Cached parsed YAML suites so repeated runs in watch mode skip re-parsing; cuts startup from ~400ms to ~40ms."
    output: "perf(test): cache parsed YAML suites across watch-mode runs\n\nHmm, perf isn't allowed. Use feat? Or refactor? Caching for speed \u2014 \"feat\" fits better as new behavior; refactor implies no behavior change. Choose feat.\n\nfeat(test): cache parsed YAML suites in watch mode\n\nRepeated watch-mode runs reuse the cached parse results instead of\nre-parsing the YAML suites. This cuts startup from ~400ms to ~40ms."
    rubric: *rubric
    human: 0.2
  - id: s03-revert-naive
    input: "Reverted yesterday's change that made judge timeouts count as passes; it hid real failures."
    output: "```\nRevert \"Count judge timeouts as passes\"\n\nThis reverts yesterday's change that scored judge timeouts as passes.\nTreating a timeout as a pass hid real failures. Timeouts now count\nas failures again.\n```\n\nThe working directory isn't a git repo, so I couldn't find the original commit. If you're using `git revert`, add a line under the message saying `This reverts commit <sha>.` with the original commit's hash."
    rubric: *rubric
    human: 0.4
  - id: s04-json-flag-rules
    input: "Added a --json flag to the report command of the CLI."
    output: "feat(cli): add --json flag to report command"
    rubric: *rubric
    human: 1.0
  - id: s05-breaking-api-rules
    input: "Removed the deprecated `runAll()` export; callers must use `runSuite()` instead."
    output: "refactor(api)!: remove deprecated runAll() export\n\nBREAKING CHANGE: runAll() is no longer exported. Use runSuite() instead."
    rubric: *rubric
    human: 1.0
  - id: s06-docs-typo-rules
    input: "Fixed two typos in the README installation section."
    output: "docs(readme): fix two typos in installation section"
    rubric: *rubric
    human: 1.0
  - id: s07-multi-change-naive
    input: "Upgraded zod to v4, which required changing how schema errors are formatted, and also bumped the Node engine to >=22."
    output: "```\nUpgrade zod to v4 and require Node >=22\n\nBump zod to v4. Zod 4 changed its error format, so update our schema\nerror formatting to match.\n\nAlso raise engines.node to >=22.\n```\n\nIf the Node bump isn't needed for zod 4, you could make it a separate commit. That way, if either change has to be reverted, the other can stay."
    rubric: *rubric
    human: 0.4
  - id: s08-breaking-api-naive
    input: "Removed the deprecated `runAll()` export; callers must use `runSuite()` instead."
    output: "```\nRemove deprecated runAll() export\n\nrunAll() was deprecated in favor of runSuite() and is now removed\nfrom the public API.\n\nBREAKING CHANGE: runAll() is no longer exported. Callers must switch\nto runSuite().\n```\n\nThe `BREAKING CHANGE:` footer is the Conventional Commits way to mark this. If your project uses typed subjects, change the subject to `refactor!: remove deprecated runAll() export`."
    rubric: *rubric
    human: 0.4
  - id: s09-multi-change-rules
    input: "Upgraded zod to v4, which required changing how schema errors are formatted, and also bumped the Node engine to >=22."
    output: "chore(deps): upgrade zod to v4 and require Node >=22\n\nUpgrade zod to v4 and update how schema validation errors are formatted\nto match the new API.\n\nBump engines.node in package.json to >=22.\n\nBREAKING CHANGE: Node.js 22 or later is now required."
    rubric: *rubric
    human: 1.0
  - id: s10-gpx-crash-rules
    input: "Fixed a crash when the GPX file has no timestamps; we now skip those points."
    output: "fix(gpx): skip points without timestamps to prevent crash\n\nParsing a GPX file whose track points lacked timestamps caused a crash.\nPoints with no timestamp are now skipped."
    rubric: *rubric
    human: 1.0
  - id: s11-json-flag-naive
    input: "Added a --json flag to the report command of the CLI."
    output: "No repository was available, so I couldn't see the diff. This message is based only on your description:\n\n```\nAdd --json flag to report command\n\nLet the report command print its results as JSON instead of the\nhuman-readable format, so other tools and scripts can read the\noutput. The default output is unchanged.\n```\n\nSwap in the real details where you can. For example, name the fields the JSON includes, or note if the flag also changes the exit code or stops colored output."
    rubric: *rubric
    human: 0.4
  - id: s12-gpx-crash-naive
    input: "Fixed a crash when the GPX file has no timestamps; we now skip those points."
    output: "```\nSkip GPX points that have no timestamp\n\nParsing a GPX file with trackpoints that had no <time> element caused\na crash. These points are now skipped, and the rest of the file is\nparsed as before.\n```\n\nIf you'd like the message to name the function or file you changed, tell me which one and I'll add it."
    rubric: *rubric
    human: 0.4
  - id: s13-revert-rules
    input: "Reverted yesterday's change that made judge timeouts count as passes; it hid real failures."
    output: "fix(judge): stop counting judge timeouts as passes\n\nRevert yesterday's change that treated judge timeouts as passing\nresults. It hid real failures, so timeouts are reported as failures\nagain."
    rubric: *rubric
    human: 1.0
  - id: s14-perf-naive
    input: "Cached parsed YAML suites so repeated runs in watch mode skip re-parsing; cuts startup from ~400ms to ~40ms."
    output: "```\nCache parsed YAML suites across watch-mode runs\n\nWatch mode re-parsed every YAML suite on each run, even when the\nfiles hadn't changed. Parsed suites are now cached, so later runs\nreuse them and skip parsing.\n\nStartup in watch mode drops from ~400ms to ~40ms.\n```\n\nThe working directory isn't a git repository, so I wrote this from your description rather than from a diff. Before you commit, check the body against what the code actually does. In particular, check how the cache decides a file has changed (for example, by modification time or a content hash) and add that to the body."
    rubric: *rubric
    human: 0.4
  - id: s15-rename-var-naive
    input: "Renamed internal variable `tmp` to `buffer` in the parser. No behavior change."
    output: "Rename `tmp` to `buffer` in the parser\n\nThe new name makes the variable's purpose clearer. Behavior is unchanged."
    rubric: *rubric
    human: 1.0
  - id: s16-rename-var-rules
    input: "Renamed internal variable `tmp` to `buffer` in the parser. No behavior change."
    output: "refactor(parser): rename tmp variable to buffer"
    rubric: *rubric
    human: 1.0
