# Evaluates the commit-message skill via Claude Code in headless mode.
# Requires the `claude` CLI. Run: skill-gauge run examples/commit-message/suite.yaml
name: commit-message
provider:
  # Isolated: the skill is the *whole* system prompt, no tools, empty working
  # directory — so we measure the skill, not the repo or local Claude settings.
  command: claude -p --tools "" --no-session-persistence --system-prompt "$(cat "$SKILL_GAUGE_SUITE_DIR/SKILL.md")"
  isolate: true
  timeoutMs: 90000
judge:
  # Isolated: no tools, no Claude Code agent prompt, empty working directory.
  command: claude -p --model haiku --tools "" --no-session-persistence --system-prompt "You are a strict evaluator. Follow the user's grading instructions exactly."
  isolate: true
repeat: 3
concurrency: 3

cases:
  - id: bugfix
    input: Fixed a crash when the GPX file has no timestamps; we now skip those points.
    assert:
      - { type: regex, pattern: "^fix(\\([\\w-]+\\))?: " }
      - { type: max-length, value: 200 }
      - { type: not-contains, value: "```" }

  - id: feature-with-scope
    input: Added a --json flag to the report command of the CLI.
    assert:
      - { type: regex, pattern: "^feat\\(cli\\): " }
      - type: llm-rubric
        rubric: The subject is imperative mood ("add", not "added") and mentions the --json flag.
        threshold: 0.8

  - id: no-chatter
    input: Renamed internal variable `tmp` to `buffer` in the parser. No behavior change.
    assert:
      - { type: regex, pattern: "^refactor" }
      - { type: not-contains, value: "Here", ignoreCase: false }

  # Regression case: "perf" was missing from the allowed types, and the model
  # leaked its deliberation ("Hmm, perf isn't allowed…") into the output.
  - id: perf-type
    input: Cached parsed YAML suites so repeated runs in watch mode skip re-parsing; cuts startup from ~400ms to ~40ms.
    assert:
      - { type: regex, pattern: "^perf(\\([\\w-]+\\))?: " }
      - { type: regex, pattern: "^[^\\n]+(\\n\\n[\\s\\S]+)?$" }
      - { type: not-contains, value: "Hmm" }
      - { type: not-contains, value: "```" }
